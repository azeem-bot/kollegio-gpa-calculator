<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kollegioapp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What's the Difference Between Weighted and Unweighted GPA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Unweighted GPA uses a standard 4.0 scale and treats all classes equally. Weighted GPA accounts for course difficulty, giving extra points for AP, Honors, and IB classes, often resulting in a scale above 4.0. Colleges use both when evaluating your transcript."
        }
      },
      {
        "@type": "Question",
        "name": "What GPA Do I Need to Get Into a Top College?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ivy League and top-tier schools typically admit students with unweighted GPAs between 3.8 and 4.0, often with weighted GPAs above 4.5. Course rigor, essays, and extracurriculars also play major roles."
        }
      },
      {
        "@type": "Question",
        "name": "Will My GPA Go Up If I Get Better Grades Next Semester?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Your cumulative GPA is recalculated each semester by averaging all your course grades weighted by credit hours. One strong semester can meaningfully improve your overall GPA."
        }
      },
      {
        "@type": "Question",
        "name": "Do Colleges Look at Weighted or Unweighted GPA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Most colleges recalculate GPA from your transcript using their own formula, focusing on core academic classes. They consider both the unweighted number and the rigor of your course load."
        }
      },
      {
        "@type": "Question",
        "name": "Is a 3.5 GPA Good for College Admissions?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A 3.5 unweighted GPA is competitive for most four-year colleges and many selective state universities. It may be below the threshold for Ivy League schools but opens doors to hundreds of quality institutions."
        }
      },
      {
        "@type": "Question",
        "name": "How Do I Calculate My Cumulative GPA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Cumulative GPA is calculated by dividing the total grade points earned (grade value times credit hours for each course) by the total credit hours attempted. Weighted courses earn extra grade points."
        }
      },
      {
        "@type": "Question",
        "name": "Can I Retake a Class to Improve My GPA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Some high schools allow you to retake a class and replace the original grade on your transcript. Policies vary by school, so check with your counselor."
        }
      },
      {
        "@type": "Question",
        "name": "Do Electives and PE Count Toward My GPA?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Electives and PE typically count toward your high school GPA, but many colleges recalculate GPA using only core academic classes — English, math, science, social studies, and foreign language."
        }
      }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "High School GPA Calculator",
    "url": "https://www.kollegio.ai/gpa-calculator",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "description": "Free high school GPA calculator that shows weighted and unweighted GPA and matches you with colleges based on your academic profile."
  }
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
